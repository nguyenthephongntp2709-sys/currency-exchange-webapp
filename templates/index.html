<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Exchange</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Currency Exchange</h1>

        <p class="subtitle">
            Tra cứu và chuyển đổi tỷ giá tiền tệ
        </p>

        <div class="exchange-box">

            <h2>Chuyển đổi tiền tệ</h2>

            <div class="form-group">
                <label for="amount">Số tiền</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Nhập số tiền"
                    min="0"
                >
            </div>

            <div class="currency-row">

                <div class="form-group">
                    <label for="from_currency">Từ</label>

                    <select id="from_currency">
                        <option value="USD">USD - Đô la Mỹ</option>
                        <option value="VND">VND - Việt Nam Đồng</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="JPY">JPY - Yên Nhật</option>
                        <option value="GBP">GBP - Bảng Anh</option>
                    </select>
                </div>

                <button id="swap-btn" type="button">
                    ⇄
                </button>

                <div class="form-group">
                    <label for="to_currency">Sang</label>

                    <select id="to_currency">
                        <option value="VND">VND - Việt Nam Đồng</option>
                        <option value="USD">USD - Đô la Mỹ</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="JPY">JPY - Yên Nhật</option>
                        <option value="GBP">GBP - Bảng Anh</option>
                    </select>
                </div>

            </div>

            <button id="convert-btn" class="convert-btn">
                Chuyển đổi
            </button>

            <div
    id="result"
    class="result"
    data-rate="{{ rate }}"
    data-date="{{ date }}"
>
    <p>Kết quả sẽ hiển thị ở đây</p>
</div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
